<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gh👻st_Payment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        body {
            background-color: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header & Main Screen */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .main-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
            object-fit: cover;
            border: 1px solid #eaeaea;
        }
        .header h1 {
            color: #6b7280;
            font-size: 20px;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .mobile-banking-btn {
            background-color: #0052cc;
            color: white;
            text-align: center;
            padding: 12px;
            margin: 0 20px 20px;
            border-radius: 6px;
            font-weight: 600;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }
        .payment-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 75px;
        }
        .payment-card img {
            max-width: 90%;
            max-height: 40px;
            object-fit: contain;
        }
        .payment-card:active {
            transform: scale(0.98);
        }

        /* Bottom Section - Fixed */
        .bottom-pay-btn {
            background: #dce7f9;
            color: #0052cc;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 20px 20px 0 0;
            cursor: pointer;
            width: 100%;
            flex-shrink: 0;
            z-index: 5;
        }

        /* Modal Screen */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f4f7fc;
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .modal-header {
            background: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eaeaea;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #666;
        }
        .modal-logo-area {
            background: #fff;
            margin: 15px 20px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
        }
        .modal-logo-area img {
            max-height: 45px;
            object-fit: contain;
        }
        .amount-row {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #444;
            align-items: center;
        }
        .small-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            object-fit: cover;
        }
        .amount-box {
            font-size: 18px;
        }

        /* Instructions Box */
        .instruction-box {
            margin: 0 20px;
            border-radius: 8px;
            color: white;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .trx-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        
        .steps {
            list-style: none;
            font-size: 13px;
            line-height: 1.6;
        }
        .steps li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 15px;
        }
        .steps li::before {
            content: "•";
            position: absolute;
            left: 0;
            top: 0;
            font-size: 16px;
        }
        .copy-btn {
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 5px;
        }

        .verify-btn {
            color: white;
            border: none;
            padding: 15px;
            width: calc(100% - 40px);
            margin: 15px 20px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Screen -->
    <div id="mainScreen" style="display: flex; flex-direction: column; height: 100%; width: 100%;">
        
        <div style="flex: 1; overflow-y: auto;">
            <div class="header">
                <img id="mainLogo" src="" alt="Logo" class="main-logo">
                <h1 id="siteTitle">Gh👻st_Payment</h1>
            </div>

            <div class="mobile-banking-btn" id="mobileBankingText">
                মোবাইল ব্যাংকিং
            </div>

            <!-- Dynamic Payment Grid -->
            <div class="payment-grid" id="paymentGrid">
                <!-- Data will load here from JSON -->
            </div>
            
            <div style="height: 30px;"></div> 
        </div>

        <div class="bottom-pay-btn" id="bottomPayBtn">
            <!-- Loading or JSON text -->
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeModal()">❮</button>
            <span style="color: #666; font-size: 14px;">A/EN ✕</span>
        </div>

        <div class="modal-logo-area">
            <img id="modalLogoImg" src="" alt="Payment Logo">
        </div>

        <div class="amount-row">
            <div>
                <img id="smallLogo" src="" alt="icon" class="small-logo"> 
                <span id="modalSiteName" style="vertical-align: middle;">Gh👻st_Payment</span>
            </div>
            <div class="amount-box" id="modalAmountBox"></div>
        </div>

        <div class="instruction-box" id="instructionBox">
            <div class="input-group">
                <label id="trxLabel">ট্রানজেকশন আইডি দিন</label>
                <input type="text" id="trxInput" class="trx-input" placeholder="">
            </div>

            <ul class="steps" id="stepsList">
                <!-- Steps will load here from JSON -->
            </ul>
        </div>

        <button class="verify-btn" id="verifyBtn" onclick="verifyAndSendWhatsApp()">ভেরিফাই</button>
    </div>
</div>

<script>
    // --- Global Variables ---
    const rawUrl = "https://raw.githubusercontent.com/ghostpanel/Ghost-File/refs/heads/main/Ghost%20Payment.json";
    const jsonUrl = rawUrl + "?t=" + new Date().getTime(); // Cache busting
    
    let globalData = null;
    let selectedMethodName = "";
    let selectedMethodNumber = "";

    // --- JSON Fetching ---
    fetch(jsonUrl)
        .then(response => response.json())
        .then(data => {
            globalData = data;
            
            // Set Header & Texts
            document.title = data.siteName;
            document.getElementById("siteTitle").innerText = data.siteName;
            document.getElementById("modalSiteName").innerText = data.siteName;
            document.getElementById("mobileBankingText").innerText = data.mobileBankingText;
            document.getElementById("bottomPayBtn").innerText = data.payButtonText;
            document.getElementById("modalAmountBox").innerText = data.amountText;
            
            // Set Logos
            document.getElementById("mainLogo").src = data.headerLogo;
            document.getElementById("smallLogo").src = data.headerLogo;
            
            // Build Payment Grid
            const grid = document.getElementById("paymentGrid");
            grid.innerHTML = "";
            
            data.paymentMethods.forEach((method, index) => {
                if(method.status === "on" || method.status === true) {
                    const card = document.createElement("div");
                    card.className = "payment-card";
                    card.onclick = () => openModal(index);
                    card.innerHTML = `<img src="${method.logo}" alt="${method.name}">`;
                    grid.appendChild(card);
                }
            });
        })
        .catch(err => {
            console.error("JSON লোড হতে সমস্যা হচ্ছে: ", err);
            document.getElementById("bottomPayBtn").innerText = "Network Error!";
        });

    // --- Modal Control ---
    function openModal(methodIndex) {
        if(!globalData) return;
        
        const method = globalData.paymentMethods[methodIndex];
        const modalData = globalData.modal;
        
        // Store for WhatsApp message
        selectedMethodName = method.name;
        selectedMethodNumber = method.number;
        
        // Show modal
        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('paymentModal').style.display = 'flex';
        
        // Set dynamic logo & colors for modal
        document.getElementById('modalLogoImg').src = method.logo;
        document.getElementById('instructionBox').style.backgroundColor = method.boxColor;
        document.getElementById('verifyBtn').style.backgroundColor = method.btnColor;
        
        // Set texts from JSON
        document.getElementById('trxLabel').innerText = modalData.transactionLabel;
        document.getElementById('trxInput').placeholder = modalData.transactionPlaceholder;
        document.getElementById('verifyBtn').innerText = modalData.verifyBtnText;
        
        // Build dynamic steps list
        const stepsUl = document.getElementById('stepsList');
        stepsUl.innerHTML = "";
        
        modalData.steps.forEach(step => {
            let liHTML = step
                .replace(/{method}/g, method.name)
                .replace(/{ussd}/g, method.ussd)
                .replace(/{number}/g, method.number)
                .replace(/{amount}/g, globalData.amountValue);
            
            if (liHTML.includes("{copy_button}")) {
                liHTML = liHTML.replace(/{copy_button}/g, `<button class="copy-btn" onclick="copyNumber('${method.number}')">${modalData.copyBtnText}</button>`);
            }
            if (!method.ussd || method.ussd.trim() === "") {
                liHTML = liHTML.replace(" ডায়াল কোড দিন অথবা আপনার ", "আপনার ");
            }

            const li = document.createElement("li");
            li.innerHTML = liHTML;
            stepsUl.appendChild(li);
        });
    }

    function closeModal() {
        document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'flex';
        document.getElementById('trxInput').value = ""; // Clear input
    }

    function copyNumber(number) {
        navigator.clipboard.writeText(number).then(() => {
            alert("Number copied: " + number);
        });
    }

    // --- WhatsApp Integration ---
    function verifyAndSendWhatsApp() {
        const trxId = document.getElementById('trxInput').value.trim();
        if(trxId === "") {
            alert("দয়া করে ট্রানজেকশন আইডি দিন!");
            return;
        }

        // Message Format for WhatsApp
        const message = `*New Payment Request* 👻\n\n` +
                        `*Amount:* ${globalData.amountValue} BDT\n` +
                        `*Method:* ${selectedMethodName}\n` +
                        `*Sent To:* ${selectedMethodNumber}\n` +
                        `*Trx ID:* ${trxId}`;

        const encodedMessage = encodeURIComponent(message);
        
        // এখানে 8801XXXXXXXXX এর জায়গায় আপনার আসল WhatsApp নাম্বার দিন (অবশ্যই 88 সহ দিবেন, কিন্তু + দিবেন না)
        const yourWhatsAppNumber = "8801907293620"; 
        
        // এটি ইউজারের ফোনে সরাসরি তার হোয়াটসঅ্যাপ ওপেন করে আপনার নাম্বারে মেসেজ রেডি করে দিবে
        const waUrl = `https://wa.me/${yourWhatsAppNumber}?text=${encodedMessage}`;
        
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
